edition.workspace = true
license.workspace = true
default-run = "type"

[[bin]]
name = "type"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
markdown-core = { path = "../markdown-core" }
anyhow = "1"
tempfile = "3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

